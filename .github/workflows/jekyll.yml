name: Build and deploy LJT-Homepage

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Build navigation JavaScript
        run: |
          npm install -g uglify-js
          uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js
      - name: Build the homepage
        # Use _config.yml's project-site baseurl; do not override it with an empty value.
        run: bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production
      - name: Validate single-page output and content
        run: python3 scripts/validate_homepage.py
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
      - name: Check GitHub Pages configuration
        id: pages
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const { data } = await github.rest.repos.getPages({
                owner: context.repo.owner,
                repo: context.repo.repo
              });
              const enabled = data.build_type === 'workflow';
              core.setOutput('enabled', enabled ? 'true' : 'false');
              if (!enabled) {
                core.notice('The homepage built successfully. Set Settings > Pages > Source to GitHub Actions to enable deployment.');
              }
            } catch (error) {
              if (error.status !== 404) throw error;
              core.setOutput('enabled', 'false');
              core.notice('The homepage built successfully, but GitHub Pages is not enabled. Enable it in Settings > Pages with GitHub Actions as the source.');
            }

  deploy:
    needs: build
    if: needs.build.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
